.mob{display:none}
.deco{position:absolute;pointer-events:none;opacity:.1;color:var(--chocolate)}

@media(max-width:800px){

  footer{padding-bottom:96px}
  .hero h1{font-size:44px!important}
}

<circle cx="150" cy="10" r="6" fill="currentColor"/><circle cx="150" cy="60" r="6" fill="currentColor"/><circle cx="150" cy="110" r="6" fill="currentColor"/><circle cx="150" cy="160" r="6" fill="currentColor"/><circle cx="150" cy="210" r="6" fill="currentColor"/><circle cx="150" cy="260" r="6" fill="currentColor"/><circle cx="150" cy="310" r="6" fill="currentColor"/><circle cx="150" cy="360" r="6" fill="currentColor"/><circle cx="150" cy="410" r="6" fill="currentColor"/><circle cx="150" cy="460" r="6" fill="currentColor"/>

<div class="wrap" style="max-width:800px;position:relative;z-index:1">

<script>
/* ====================================================================
   Чтобы пополнять словарь с телефона через Google Таблицу:
   1) Создай Google Таблицу с двумя колонками: Термин | Определение
   2) Файл → «Поделиться» → «Опубликовать в интернете» → выбери
      текущий лист → формат CSV → «Опубликовать»
   3) Скопируй ссылку, которую даст Google, и вставь её вместо
      строки ниже (между кавычками)
   ==================================================================== */
const SHEET_CSV_URL = "ВСТАВЬ_СЮДА_ССЫЛКУ_НА_ОПУБЛИКОВАННЫЙ_CSV";

// то, что было на сайте раньше — используется, пока таблица не подключена
const FALLBACK_TERMS = [
["Анамнез","История состояния: жалобы, режим, питание, стрессы, операции, роды, травмы."],
["Висцеральный","Относящийся к внутренним органам. Мягкая работа с органами и связями между ними."],
["Диафрагма","Главная дыхательная мышца. Когда «зажата», влияет на дыхание, органы и давление в теле."],
["Фасция","Соединительная ткань, которая обволакивает мышцы и органы."],
["Компенсация","Способ тела обойти ограничение. Со временем сама становится проблемой."],
["Остеопатия","Тело как единая система. Работа руками на восстановление подвижности структур и связей."],
["Паттерн движения","Привычный способ, которым тело выполняет движение."],
["Самоправки","Практики, которые вы делаете самостоятельно дома."],
["Системная телесная адаптация","Авторский метод: работа руками + самоправки. Ищем связи, а не отдельную «проблемную зону»."],
["ЖКТ","Желудочно-кишечный тракт: подвижность органов и связи с диафрагмой и позвоночником."],
["Грудная клетка","Рёбра, грудина, мышцы и фасции. От подвижности зависят дыхание и органы."],
["Акупунктура","Воздействие на определённые точки тела, подключается точечно."],
["Ткани","Мышцы, фасции, связки, оболочки органов."],
["Нервная система","Управляет мышцами, органами, восприятием."]
];

function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], next=text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){field+='"';i++;}
      else if(c==='"'){inQuotes=false;}
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){/* skip */}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}

function render(terms){
  const list=document.getElementById('list');
  list.innerHTML = terms.map(([term,def])=>{
    const t=(term+' '+def).toLowerCase();
    return `<article class="term" data-t="${t.replace(/"/g,'&quot;')}" style="border-bottom:1px solid var(--line);padding:26px 0">
      <h3 class="display" style="font-size:24px;color:var(--chocolate)">${term}</h3>
      <p class="muted" style="margin-top:8px">${def}</p>
    </article>`;
  }).join('');
  attachSearch();
}

function attachSearch(){
  const q=document.getElementById('q');
  const handler=()=>{
    const s=q.value.toLowerCase().trim();
    document.querySelectorAll('.term').forEach(el=>{
      el.style.display=!s||el.dataset.t.includes(s)?'':'none';
    });
  };
  q.removeEventListener('input',handler);
  q.addEventListener('input',handler);
}

async function loadTerms(){
  const status=document.getElementById('status');
  if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('ВСТАВЬ_СЮДА')===0){
    render(FALLBACK_TERMS);
    return;
  }
  try{
    const res=await fetch(SHEET_CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('bad response');
    const text=await res.text();
    let rows=parseCSV(text);
    if(rows.length && rows[0][0] && rows[0][0].toLowerCase().includes('термин')) rows=rows.slice(1);
    const terms=rows.filter(r=>r[0] && r[1]).map(r=>[r[0].trim(), r[1].trim()]);
    if(terms.length){ render(terms); status.textContent=''; }
    else throw new Error('empty sheet');
  }catch(e){
    render(FALLBACK_TERMS);
    status.textContent='';
  }
}
loadTerms();
</script>
